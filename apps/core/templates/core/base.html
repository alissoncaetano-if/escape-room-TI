{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Missão Tech | {% block title %}Acesso{% endblock %}</title>
    <style>
        :root {
            --bg-color: #050505;       /* Preto quase absoluto */
            --terminal-green: #00ff41; /* Verde Matrix */
            --dim-green: #008F11;      /* Verde escuro */
            --error-red: #ff3333;
            --font-stack: 'Courier New', Courier, monospace;
        }

        body {
            background-color: var(--bg-color);
            color: var(--terminal-green);
            font-family: var(--font-stack);
            margin: 0;
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }

        /* Scanline effect (opcional, dá efeito de monitor velho) */
        body::before {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            z-index: 2;
            background-size: 100% 2px, 3px 100%;
            pointer-events: none;
        }

        header {
            border-bottom: 2px solid var(--dim-green);
            padding: 1rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 3;
        }

        .logo { font-size: 1.5rem; font-weight: bold; text-transform: uppercase; letter-spacing: 2px; }
        
        .container {
            max-width: 800px;
            margin: 2rem auto;
            padding: 2rem;
            border: 1px solid var(--dim-green);
            background: rgba(0, 20, 0, 0.3);
            box-shadow: 0 0 15px var(--dim-green);
            z-index: 3;
            position: relative;
        }

        a { color: var(--terminal-green); text-decoration: none; border-bottom: 1px dashed var(--dim-green); }
        a:hover { background-color: var(--terminal-green); color: black; }

        input {
            background: #000;
            border: 1px solid var(--terminal-green);
            color: var(--terminal-green);
            padding: 10px;
            width: 100%;
            font-family: var(--font-stack);
            margin-bottom: 15px;
            box-sizing: border-box;
        }

        button, .btn {
            background: transparent;
            border: 2px solid var(--terminal-green);
            color: var(--terminal-green);
            padding: 10px 20px;
            font-family: var(--font-stack);
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            display: inline-block;
        }

        button:hover, .btn:hover {
            background: var(--terminal-green);
            color: #000;
            box-shadow: 0 0 10px var(--terminal-green);
        }

        .nav-links a { margin-left: 15px; border: none; }
    </style>
</head>
<body>
    <header>
        <div class="logo">>> MISSÃO_TECH_</div>
        <div class="nav-links">
            {% if user.is_authenticated %}
                <span>Agente: {{ user.username }}</span>
                <form action="{% url 'logout' %}" method="post" style="display:inline;">
                    {% csrf_token %}
                    <button type="submit" style="border:none; padding:0; margin-left:10px; font-size:0.8em;">[LOGOUT]</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}">[LOGIN]</a>
                <a href="{% url 'core:register' %}">[CADASTRO]</a>
            {% endif %}
        </div>
    </header>

    <div class="container">
        {% block content %}{% endblock %}
    </div>

</body>
</html>
