{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Missão Tech | {% block title %}Sistema{% endblock %}</title>
    <style>
        :root {
            --bg-color: #050505;
            --terminal-green: #00ff41;
            --dim-green: #008F11;
            --dark-gray: #1a1a1a;
            --error-red: #ff3333;
            --font-stack: 'Courier New', Courier, monospace;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            background-color: var(--bg-color);
            color: var(--terminal-green);
            font-family: var(--font-stack);
            overflow-x: hidden;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* Efeito de scanline (Monitor antigo) */
        body::after {
            content: " ";
            display: block;
            position: absolute;
            top: 0; left: 0; bottom: 0; right: 0;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.1) 50%);
            background-size: 100% 4px;
            z-index: 1000;
            pointer-events: none;
        }

        /* Navbar estilo Terminal */
        .navbar {
            background: #000;
            border-bottom: 2px solid var(--terminal-green);
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 900;
        }

        .navbar-brand { font-size: 1.5rem; font-weight: bold; letter-spacing: 2px; text-transform: uppercase; }
        
        .nav-link, .logout-btn {
            color: var(--terminal-green);
            text-decoration: none;
            margin-left: 20px;
            border: 1px solid transparent;
            padding: 5px 10px;
            background: none;
            cursor: pointer;
            font-family: var(--font-stack);
            font-size: 1rem;
        }

        .nav-link:hover, .logout-btn:hover {
            border-color: var(--terminal-green);
            background: rgba(0, 255, 65, 0.1);
        }

        /* Utilitários */
        .hidden { display: none !important; }
        .btn {
            background: transparent;
            border: 2px solid var(--terminal-green);
            color: var(--terminal-green);
            padding: 10px 20px;
            font-family: var(--font-stack);
            font-weight: bold;
            cursor: pointer;
            text-transform: uppercase;
            transition: 0.2s;
        }
        .btn:hover {
            background: var(--terminal-green);
            color: #000;
            box-shadow: 0 0 15px var(--terminal-green);
        }

        input {
            background: #000;
            border: 1px solid var(--dim-green);
            color: var(--terminal-green);
            padding: 12px;
            width: 100%;
            font-family: var(--font-stack);
            margin-bottom: 15px;
        }
        input:focus { outline: none; border-color: var(--terminal-green); box-shadow: 0 0 5px var(--dim-green); }

        /* Estilos específicos das telas herdadas */
        {% block extra_css %}{% endblock %}
    </style>
</head>
<body>
    {% if user.is_authenticated %}
    <nav class="navbar">
        <div class="navbar-brand">>> MISSÃO_TECH_</div>
        <div class="navbar-menu">
            <span style="font-size: 0.8em; margin-right: 20px;">AGENTE: {{ user.username|upper }}</span>
            <form action="{% url 'logout' %}" method="post" style="display:inline;">
                {% csrf_token %}
                <button type="submit" class="logout-btn">[DESCONECTAR]</button>
            </form>
        </div>
    </nav>
    {% endif %}

    {% block content %}{% endblock %}

    <script>
        {% block extra_js %}{% endblock %}
    </script>
</body>
</html>
